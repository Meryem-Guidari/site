<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeautyGirl - Reveal your natural glow</title>
    <link rel="stylesheet" href="style.css">
    <!-- Police Google Fonts moderne et élégante -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <!-- Icône d'éclat / étincelle pour la beauté -->
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
            </svg>
            <span class="logo-text">beautygirl</span>
        </div>

        <nav class="nav-links">
            <a href="#">Skincare</a>
            <a href="#">Maquillage</a>
            <a href="#">Notre histoire</a>
            <a href="#" class="btn-secondary">Diagnostic peau</a>
            <a href="#" class="btn-primary">Commander</a>
        </nav>
    </header>

    <main class="hero">
        <!-- Visuel produit à gauche -->
        <div class="hero-image-container">
            <!-- Remplacez 'cosmetics.png' par une photo détourée de flacons, sérums et rouges à lèvres -->
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=800&q=80" alt="Maquillage et cosmétiques BeautyGirl" class="hero-image">        </div>

        <!-- Titre et appel à l'action à droite -->
        <div class="hero-content">
            <h1 class="headline">We reveal your glow<span class="cursor">|</span></h1>
            <p class="subheadline">Des soins clean et du maquillage éclatant conçus pour sublimer chaque peau au quotidien.</p>
            <a href="#" class="btn-cta">
                Découvrir la collection <span>&rsaquo;</span>
            </a>
        </div>
    </main>

</body>
</html>
